<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E141B"/>
      <stop offset="100%" stop-color="#070A0D"/>
    </linearGradient>
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#00F5B8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Contenedor cuadrado redondeado con estética minimalista dark mode -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#dsBg)" stroke="#222F3E" stroke-width="2"/>

  <!-- Bracket izquierdo < en tono acento menta neón -->
  <path d="M 15 24 L 9 32 L 15 40" stroke="#00F5B8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#dsGlow)"/>

  <!-- Letra D vectorizada -->
  <path d="M 18.5 23.5 L 18.5 40.5 M 18.5 23.5 L 22.5 23.5 C 26.5 23.5 28 26.5 28 32 C 28 37.5 26.5 40.5 22.5 40.5 L 18.5 40.5" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Letra S vectorizada -->
  <path d="M 39 26.5 C 38 24.5 36.5 23.5 34.5 23.5 C 32.5 23.5 31 24.8 31 27 C 31 30.2 39.5 29.8 39.5 35 C 39.5 38.8 37 40.5 34.2 40.5 C 32 40.5 30.5 39.5 29.5 37.5" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Barra / minimalista -->
  <line x1="43" y1="40.5" x2="46.5" y2="23.5" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Bracket derecho > en tono acento menta neón -->
  <path d="M 49 24 L 55 32 L 49 40" stroke="#00F5B8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#dsGlow)"/>
</svg>