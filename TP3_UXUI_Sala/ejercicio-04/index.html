<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 04 - Formulario Simple Accesible</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-wrapper">
    <header>
      <h1>Formulario de Contacto</h1>
      <p>Completa los siguientes campos para enviarnos tu consulta o propuesta.</p>
    </header>

    <form action="#" method="post">
      <div class="form-group">
        <label for="user-name">Nombre completo <span aria-hidden="true" class="required">*</span></label>
        <input type="text" id="user-name" name="name" required placeholder="Ej. Juan Pérez" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="user-email">Correo electrónico <span aria-hidden="true" class="required">*</span></label>
        <input type="email" id="user-email" name="email" required placeholder="nombre@dominio.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="user-message">Mensaje <span aria-hidden="true" class="required">*</span></label>
        <textarea id="user-message" name="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>

      <button type="submit">Enviar Mensaje</button>
    </form>
  </main>
</body>
</html>
