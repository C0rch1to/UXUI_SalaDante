<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 13 - Formulario Estilizado con Transiciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-container">
    <header>
      <h1>Contacto Profesional</h1>
      <p>Formulario con bordes redondeados, transiciones suaves y estados <code>:focus</code>, <code>:hover</code> y <code>:active</code> diferenciados.</p>
    </header>

    <form action="#" method="post" novalidate>
      <div class="form-field">
        <label for="contact-name">Nombre Completo <span class="required">*</span></label>
        <input type="text" id="contact-name" name="name" required placeholder="Ej. Camila Morales" autocomplete="name">
      </div>

      <div class="form-field">
        <label for="contact-email">Correo Electrónico <span class="required">*</span></label>
        <input type="email" id="contact-email" name="email" required placeholder="camila@ejemplo.com" autocomplete="email">
      </div>

      <div class="form-field">
        <label for="contact-message">Mensaje o Consulta <span class="required">*</span></label>
        <textarea id="contact-message" name="message" rows="5" required placeholder="Detalla tu consulta o mensaje aquí..."></textarea>
      </div>

      <button type="submit" class="submit-button">
        Enviar Mensaje
      </button>
    </form>
  </main>
</body>
</html>
