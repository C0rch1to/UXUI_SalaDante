<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenArt - NFT Digital Art Marketplace</title>
    <meta name="description" content="OpenArt - The premier marketplace for digital art and NFTs. Discover, collect, and sell extraordinary NFTs.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'bg-primary': '#0D0D2B',
                        'bg-secondary': '#1A1A3E',
                        'bg-card': '#252547',
                        'accent-purple': '#7B61FF',
                        'accent-blue': '#3B82F6',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Favicon (NFT palette emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body class="font-inter">
    <!-- App Root -->
    <div id="app">
        <!-- Loading State -->
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="w-16 h-16 border-4 border-[#7B61FF] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-400 text-lg">Loading OpenArt...</p>
            </div>
        </div>
    </div>

    <!-- Scripts (order matters: components first, then pages, then app) -->
    <script src="js/components.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
